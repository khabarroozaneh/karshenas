<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#116466"><meta name="description" content="بارگذاری خروجی منشی و مدیریت آفلاین قرارهای کارشناس"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png"><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="stylesheet" href="styles.css"><title>وردپرس جو | پنل کارشناس</title></head><body><header><div><h1>وردپرس جو</h1><p>پنل کارشناس و مدیریت قرارها</p></div><button id="installBtn" class="ghost">نصب برنامه</button></header><main><section id="main" class="view active"><section class="hero"><h2>پنل کارشناس</h2><p>فایل JSON خروجی منشی را بارگذاری کنید.</p></section><section id="alertBox" class="alert hidden"></section><div class="toolbar"><label class="file"><input id="jsonFile" type="file" accept=".json,application/json"><span>بارگذاری JSON منشی</span></label><label class="check"><input type="checkbox" id="pruneOnImport" checked><span>حذف خودکار قرارهایی که در آخرین گزارش منشی لغو شده‌اند</span></label><button id="exportData">پشتیبان پنل کارشناس</button><button id="exportReports">خروجی گزارش‌های کارشناس</button><button id="notifyBtn" class="hidden">فعال‌سازی یادآوری قرارها</button><button id="contractBtn" data-go="contracts">قراردادهای جاری <b id="contractCount">۰</b></button><button id="clearInputs" class="danger" title="فقط قرارهای بارگذاری‌شده از JSON منشی (شامل «سایت نداشتند») پاک می‌شوند؛ گزارش‌های خودتان حفظ می‌شوند">پاک‌کردن ورودی‌ها</button><button id="clearData" class="danger">پاک‌کردن اطلاعات</button></div><div class="stats"><div><b id="totalCount">۰</b><span>کل قرارها</span></div><div><b id="soonCount">۰</b><span>تا ۲۴ ساعت آینده</span></div><div><b id="overdueCount">۰</b><span>گذشته</span></div><div><b id="reportedCount">۰</b><span>گزارش ثبت‌شده</span></div></div><div class="filters"><button class="filter active" data-filter="all">همه</button><button class="filter" data-filter="soon">۲۴ ساعت آینده</button><button class="filter" data-filter="overdue">گذشته</button><button class="filter" data-filter="reported">گزارش‌دار</button><button class="filter" data-filter="unreported">بدون گزارش</button><button class="filter" data-filter="nowebsite">سایت نداشتند <b id="noWebsiteCount">۰</b></button></div><div id="result" class="result"></div><section id="appointments"></section></section><section id="reportView" class="view"><button type="button" class="back" data-go="main">← بازگشت</button><div id="reportCard"></div><form id="reportForm"><h2>ثبت گزارش قرار</h2><label>نتیجه حضور در جلسه<select id="reportStatus" required><option value="">انتخاب کنید</option><option>جلسه برگزار شد و قرارداد بسته شد</option><option>جلسه برگزار شد ولی قرارداد بسته نشد</option><option>مشتری در جلسه حاضر نشد</option><option>قرار لغو شد</option><option>قرار به تعویق افتاد (نیازمند هماهنگی مجدد)</option><option>جلسه برگزار شد و پیش‌پرداخت دریافت شد</option></select></label><label>توضیحات جلسه<textarea id="reportNotes" required minlength="3"></textarea></label><label>تاریخ و ساعت ثبت گزارش<input id="reportAt" type="datetime-local"></label><button class="primary" type="submit">ذخیره گزارش</button></form><div id="reportSaved" class="result"></div></section><section id="contracts" class="view"><button type="button" class="back" data-go="main">← بازگشت</button><h2>قراردادهای جاری</h2><p>قرارهایی که قرارداد آن‌ها بسته شده و از صفحه اصلی خارج شده‌اند.</p><div id="contractList"></div></section></main><footer>آفلاین • داده‌ها روی همین دستگاه ذخیره می‌شوند<span id="versionTag" class="ver"></span></footer><script src="jalali.js"></script><script src="app.js"></script></body></html>
